services:
  # Type of service to deploy
  type: web
  
  # Name of the service
  name: seva-sync-backend
  
  # Runtime environment
  runtime: node
  
  # Build command
  buildCommand: 'npm run build'
  
  # Start command
  startCommand: 'npm start'
  
  # Environment variables
  envVars:
    # Firebase Configuration
    - key: FIREBASE_PROJECT_ID
      value: your-firebase-project-id
    - key: FIREBASE_CLIENT_EMAIL
      value: your-service-account-email@your-project-id.iam.gserviceaccount.com
    - key: FIREBASE_PRIVATE_KEY
      value: '"-----BEGIN PRIVATE KEY-----\nYour-Private-Key-Here\n-----END PRIVATE KEY-----"'
    - key: FIREBASE_DATABASE_URL
      value: https://your-project-id.firebaseio.com
      
    # JWT Configuration
    - key: JWT_SECRET
      value: your-super-secret-jwt-key-here
    - key: JWT_EXPIRES_IN
      value: 7d
      
    # OpenRouter.ai Configuration
    - key: OPENROUTER_API_KEY
      value: your-openrouter-api-key-here
      
    # Server Configuration
    - key: PORT
      value: 3001
    - key: NODE_ENV
      value: production
    - key: FRONTEND_URL
      value: https://your-frontend-domain.vercel.app
